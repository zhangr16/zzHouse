<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我不是韭菜 · 建设中</title>
  <link rel="stylesheet" href="../portal.css">
  <style>
    .placeholder {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
    }

    .placeholder-card {
      width: min(520px, 100%);
      padding: 48px 40px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
    }

    .placeholder-card span {
      font-size: 54px;
    }

    .placeholder-card h1,
    .placeholder-card p {
      margin: 16px 0 0;
    }

    .placeholder-card p {
      color: var(--muted);
      line-height: 1.7;
    }

    .placeholder-card a {
      display: inline-block;
      margin-top: 30px;
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="placeholder">
    <section class="placeholder-card">
      <span>📊</span>
      <h1>我不是韭菜正在建设中</h1>
      <p>这个入口已接入统一首页，后续功能完成后再开放。</p>
      <a href="../index.html">返回泽泽小屋</a>
    </section>
  </main>
</body>
</html>
